<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Neon Soesjes Game</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #0b0b14, #000);
    font-family: Arial;
    color: white;
}

/* Canvas */
canvas {
    display: block;
}

/* UI overlay */
#ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,0.6);
}

button {
    padding: 15px 30px;
    font-size: 20px;
    background: #00fff2;
    border: none;
    color: black;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 0 20px #00fff2;
    margin-top: 10px;
}

h1 {
    color: #ff00ff;
    text-shadow: 0 0 20px #ff00ff;
}

#score {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 20px;
    text-shadow: 0 0 10px #00fff2;
}
</style>
</head>
<body>

<div id="score">Score: 0</div>

<div id="ui">
    <h1>Neon Soesjes Catch</h1>
    <button onclick="startGame()">START</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let basket = { x: canvas.width/2, y: canvas.height - 80, w: 120, h: 20 };
let items = [];
let score = 0;
let speed = 2;
let running = false;

let mouseX = basket.x;

document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
});

function startGame() {
    document.getElementById("ui").style.display = "none";
    items = [];
    score = 0;
    speed = 2;
    running = true;
    loop();
}

function gameOver() {
    running = false;
    document.getElementById("ui").style.display = "flex";
    document.getElementById("ui").innerHTML = `
        <h1>GAME OVER</h1>
        <p>Score: ${score}</p>
        <button onclick="startGame()">RESTART</button>
    `;
}

function spawnItem() {
    const isSoesje = Math.random() < 0.6;

    items.push({
        x: Math.random() * canvas.width,
        y: -20,
        r: 15,
        type: isSoesje ? "soesje" : "bad",
        glow: isSoesje ? "#ff00ff" : "#00fff2"
    });
}

function drawBasket() {
    basket.x += (mouseX - basket.x) * 0.2;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00fff2";
    ctx.fillStyle = "#00fff2";
    ctx.fillRect(basket.x - basket.w/2, basket.y, basket.w, basket.h);
}

function drawItems() {
    for (let i = 0; i < items.length; i++) {
        let it = items[i];
        it.y += speed;

        ctx.beginPath();
        ctx.shadowBlur = 25;
        ctx.shadowColor = it.glow;
        ctx.fillStyle = it.glow;
        ctx.arc(it.x, it.y, it.r, 0, Math.PI*2);
        ctx.fill();

        // collision
        if (
            it.y + it.r > basket.y &&
            it.x > basket.x - basket.w/2 &&
            it.x < basket.x + basket.w/2
        ) {
            if (it.type === "soesje") {
                score++;
                items.splice(i,1);
                speed += 0.05;
            } else {
                gameOver();
            }
        }

        if (it.y > canvas.height + 50) {
            items.splice(i,1);
        }
    }
}

function loop() {
    if (!running) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBasket();
    drawItems();

    document.getElementById("score").innerText = "Score: " + score;

    if (Math.random() < 0.03) spawnItem();

    requestAnimationFrame(loop);
}

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
