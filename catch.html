<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Emoji Catch Game</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #0b0b14, #000);
    font-family: Arial;
    color: white;
}

canvas {
    display: block;
}

#ui {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,0.7);
    text-align: center;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    background: #ff00ff;
    border: none;
    color: white;
    border-radius: 10px;
    box-shadow: 0 0 20px #ff00ff;
    cursor: pointer;
    margin-top: 15px;
}

h1 {
    text-shadow: 0 0 20px #ff00ff;
}

#score {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 20px;
}
</style>
</head>

<body>
 <header>
    <nav class="main-menu"> 
        <a href="Homepage.html">De Soesjes homepage</a>
  
    </nav> 
 </header>   
<div id="score">Score: 0</div>

<div id="ui">
    <h1>🍩 Catch Game</h1>
    <p>Vang de 🍩<br>Vermijd de 🥦</p>
    <button onclick="startGame()">START</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let basket = { x: canvas.width/2, y: canvas.height - 80, w: 150, h: 20 };
let items = [];
let score = 0;
let speed = 2;
let running = false;

let mouseX = basket.x;

document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
});

function startGame() {
    document.getElementById("ui").style.display = "none";
    items = [];
    score = 0;
    speed = 2;
    running = true;
    loop();
}

function gameOver() {
    running = false;
    document.getElementById("ui").style.display = "flex";
    document.getElementById("ui").innerHTML = `
        <h1>GAME OVER</h1>
        <p>Score: ${score}</p>
        <button onclick="location.reload()">RESTART</button>
    `;
}

function spawnItem() {
    const isGood = Math.random() < 0.6;

    items.push({
        x: Math.random() * canvas.width,
        y: -20,
        r: 20,
        type: isGood ? "donut" : "veg",
        emoji: isGood ? "🍩" : "🥦"
    });
}

function drawBasket() {
    basket.x += (mouseX - basket.x) * 0.2;

    ctx.fillStyle = "#ffffff";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ffffff";
    ctx.fillRect(basket.x - basket.w/2, basket.y, basket.w, basket.h);
}

function drawItems() {
    ctx.font = "30px Arial";
    ctx.textAlign = "center";

    for (let i = 0; i < items.length; i++) {
        let it = items[i];
        it.y += speed;

        // teken emoji
        ctx.fillText(it.emoji, it.x, it.y);

        // collision (op basis van cirkel rond emoji)
        const closestX = Math.max(basket.x - basket.w/2, Math.min(it.x, basket.x + basket.w/2));
        const closestY = Math.max(basket.y, Math.min(it.y, basket.y + basket.h));

        const dx = it.x - closestX;
        const dy = it.y - closestY;
        const distance = Math.sqrt(dx*dx + dy*dy);

        if (distance < it.r * 0.8) {
            if (it.type === "donut") {
                score++;
                items.splice(i,1);
                speed += 0.1;
            } else {
                gameOver();
            }
        }

        if (it.y > canvas.height + 50) {
            items.splice(i,1);
        }
    }
}

function loop() {
    if (!running) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBasket();
    drawItems();

    document.getElementById("score").innerText = "Score: " + score;

    if (Math.random() < 0.03) spawnItem();

    requestAnimationFrame(loop);
}

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
