<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kleuren Klikken</title>

<style>
body {
    margin: 0;
    background: #0b0b12;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    width: 500px;
}

h1 {
    color: #00f7ff;
    text-shadow: 0 0 10px #00f7ff;
}

#instruction {
    margin-bottom: 20px;
    color: #aaa;
}

#startBtn {
    padding: 15px 40px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #ff00d4;
    color: white;
    box-shadow: 0 0 20px #ff00d4;
}

#word {
    font-size: 60px;
    margin: 20px 0;
    text-shadow: 0 0 20px currentColor;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

button.color {
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    color: white;
}

.b { background:#00f7ff; box-shadow:0 0 10px #00f7ff; }
.r { background:#ff004c; box-shadow:0 0 10px #ff004c; }
.g { background:#00ff85; box-shadow:0 0 10px #00ff85; }
.y { background:#ffe600; color:black; box-shadow:0 0 10px #ffe600; }
.p { background:#b400ff; box-shadow:0 0 10px #b400ff; }
.pk { background:#ff00d4; box-shadow:0 0 10px #ff00d4; }

.stats {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
    font-size: 18px;
}

#timer {
    margin-top: 10px;
    color: #00f7ff;
}
</style>
</head>

<body>

<div class="container">

    <h1>KLEUREN KLIKKEN</h1>

    <div id="instruction">
        Klik op het juiste KLEURWOORD. Het woord kan anders gekleurd zijn.
    </div>

    <button id="startBtn" onclick="startGame()">START</button>

    <div id="game" style="display:none;">

        <div class="stats">
            <div>Goed: <span id="good">0</span></div>
            <div>Fout: <span id="wrong">0</span></div>
            <div>%: <span id="percent">0</span></div>
        </div>

        <div id="timer">Tijd: 0</div>

        <div id="word">-</div>

        <div class="buttons">
            <button class="color b" onclick="answer('blauw')">Blauw</button>
            <button class="color r" onclick="answer('rood')">Rood</button>
            <button class="color g" onclick="answer('groen')">Groen</button>
            <button class="color y" onclick="answer('geel')">Geel</button>
            <button class="color p" onclick="answer('paars')">Paars</button>
            <button class="color pk" onclick="answer('roze')">Roze</button>
        </div>

    </div>

</div>

<script>

const colors = [
    {name:"blauw", hex:"#00f7ff"},
    {name:"rood", hex:"#ff004c"},
    {name:"groen", hex:"#00ff85"},
    {name:"geel", hex:"#ffe600"},
    {name:"paars", hex:"#b400ff"},
    {name:"roze", hex:"#ff00d4"}
];

let round = 1;
let turn = 0;
let good = 0;
let wrong = 0;
let currentWord = "";
let time = 0;
let timer;

function startGame() {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("game").style.display = "block";

    round = 1;
    good = 0;
    wrong = 0;

    updateStats();
    nextRound();
}

function nextRound() {
    turn = 0;
    time = 10 - round;

    if (time < 3) time = 3;

    startTimer();
    nextQuestion();
}

function startTimer() {
    clearInterval(timer);

    document.getElementById("timer").innerText = "Tijd: " + time;

    timer = setInterval(() => {
        time--;
        document.getElementById("timer").innerText = "Tijd: " + time;

        if (time <= 0) {
            clearInterval(timer);
            endRound();
        }
    }, 1000);
}

function nextQuestion() {
    if (turn >= 10) {
        endRound();
        return;
    }

    let w = colors[Math.floor(Math.random() * colors.length)];
    let c = colors[Math.floor(Math.random() * colors.length)];

    currentWord = w.name;

    let el = document.getElementById("word");
    el.innerText = w.name.toUpperCase();
    el.style.color = c.hex;

    turn++;
}

function answer(a) {
    if (a === currentWord) {
        good++;
    } else {
        wrong++;
    }

    updateStats();
    nextQuestion();
}

function updateStats() {
    let total = good + wrong;
    let percent = total === 0 ? 0 : Math.round((good / total) * 100);

    document.getElementById("good").innerText = good;
    document.getElementById("wrong").innerText = wrong;
    document.getElementById("percent").innerText = percent;
}

function endRound() {
    clearInterval(timer);

    round++;

    if (round > 5) {
        let total = good + wrong;
        let percent = total === 0 ? 0 : Math.round((good / total) * 100);

        document.getElementById("game").innerHTML = `
            <h2 style="color:#00f7ff;text-shadow:0 0 10px #00f7ff;">
                GAME OVER
            </h2>

            <h3 style="color:#ff00d4;text-shadow:0 0 10px #ff00d4;">
                Goed gedaan!
            </h3>

            <p>Score: ${good} goed | ${wrong} fout</p>

            <p style="color:#00ff85;text-shadow:0 0 10px #00ff85;">
                Eindpercentage: ${percent}%
            </p>

            <button onclick="location.reload()"
                style="
                    margin-top:20px;
                    padding:12px 30px;
                    font-size:18px;
                    border:none;
                    border-radius:10px;
                    background:#ff004c;
                    color:white;
                    box-shadow:0 0 15px #ff004c;
                    cursor:pointer;
                ">
                Opnieuw spelen
            </button>
        `;
        return;
    }

    setTimeout(() => {
        nextRound();
    }, 1000);
}

</script>

</body>
</html>
